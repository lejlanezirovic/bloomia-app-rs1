<header class="admin-navbar">

  <div class="brand" routerLink="/admin/notification-logs">
    Bloomia
  </div>

  <nav class="navigation">
    <a routerLink="/admin/notification-logs" routerLinkActive="active-link">
      Notification logs
    </a>
  </nav>

  <div class="admin-profile" [matMenuTriggerFor]="userMenu">

    <div class="avatar">
      A
    </div>

    <span>Admin</span>

    <mat-icon>
      keyboard_arrow_down
    </mat-icon>

  </div>

  <mat-menu #userMenu="matMenu">

    <button
      mat-menu-item
      (click)="onLogout()">

      <mat-icon>logout</mat-icon>

      <span>Logout</span>

    </button>

  </mat-menu>

</header>

<main class="admin-content">
  <router-outlet></router-outlet>
</main>
